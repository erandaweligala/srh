server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server_tokens off;

    error_page 400 /custom_400.json;
    error_page 403 /custom_403.json;
    error_page 404 /custom_404.json;
    error_page 500 502 503 504 /custom_500.json;

    location = /custom_400.json {
        internal;
        default_type application/json;
        return 400 '{"code":"400","message":"Bad Request"}';
    }
    location = /custom_403.json {
        internal;
        default_type application/json;
        return 403 '{"code":"403","message":"Forbidden"}';
    }
    location = /custom_404.json {
        internal;
        default_type application/json;
        return 404 '{"code":"404","message":"Not Found"}';
    }
    location = /custom_500.json {
        internal;
        default_type application/json;
        return 500 '{"code":"500","message":"Internal Server Error"}';
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /srh/ {
        proxy_pass http://airtel-aaa-aaa-secure-request-handler-service:31478/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header X-XSS-Protection;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
    }

    location / {
        try_files $uri /index.html;
    }

    # Static assets - MUST repeat security headers because add_header in location overrides server block
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}



