  action-log-url: http://airtel-aaa-airtel-aaa-ums-service.airtel-aaa.svc.cluster.local:8085/ums/user-activity-log/create-log
  update-action-log-url: http://airtel-aaa-airtel-aaa-ums-service.airtel-aaa.svc.cluster.local:8085/ums/user-activity-log/update-log
  get-username-url: http://airtel-aaa-airtel-aaa-ums-service.airtel-aaa.svc.cluster.local:8085/ums/auth-user/get-username

