server:
  port: 31478
  http:
    port: 31478
  server-header: ""
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
log:
  identifierKey: UUID
  isDebug: true
info:
  app:
    name: admin-services
    msName: admin-services-secure-request-handler
com:
  adl:
    dte:
      plugins:
        logging:
          enabled: false
          level: DEBUG
        rolling:
          policy: time
        alarming:
          enabled: false
        msstat:
          enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
      # Change the actuator base path (obscurity layer)
      base-path: /internal/monitor
  endpoint:
    health:
      show-details: never        # Don't expose DB, Redis, disk details
    env:
      enabled: false             # Disable - exposes secrets
    beans:
      enabled: false             # Disable - exposes internal structure
    configprops:
      enabled: false             # Disable - exposes config/secrets
    heapdump:
      enabled: false             # Disable - exposes memory contents
    threaddump:
      enabled: false             # Disable
    mappings:
      enabled: false             # Disable - exposes all API routes
    loggers:
      enabled: false

excel.read.col.index: 0

jasypt:
  encryptor:
    password: adminPanel

rest-template:
  connection-time-out: 60000
  read-time-out: 60000

spring:
  sleuth:
    sampler:
      probability: 1.0
    web:
      skip-pattern: (^cleanup.*|.+favicon.*)
  data:
    redis:
      client-type: lettuce
      password: "${REDIS_PASSWORD}"
      timeout: 120000ms
      sentinel:
        master: "${REDIS_MASTER_NAME}"
        nodes:
          - redis-cluster-headless.cluster-redis.svc.cluster.local:26379
        password: "${REDIS_SENTINEL_PASSWORD}"
      lettuce:
        pool:
          max-active: 600
          max-wait: 3000ms
          max-idle: 200
          min-idle: 10
        shutdown-timeout: 240000ms
  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false
  servlet.multipart:
    max-file-size: 2MB
    max-request-size: 2MB
  datasource:
    url: jdbc:mysql://mysql.elasti.svc.cluster.local:3306/adauth?createDatabaseIfNotExist=true&serverTimezone=UTC
#    url: jdbc:mysql://localhost:3306/adauth?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: "${DB_MYSQL_USER}"
    password: "${DB_MYSQL_PASSWORD}"
    maxActive: 20
    maxIdle: 10
    maxWait: 5000
    driverClassName: com.mysql.cj.jdbc.Driver
  jpa:
    generate-ddl: "true"
    show-sql: "false"
    hibernate.ddlH-auto: update

ums:
  user:
    expired-in-days: 90
    status:
      meta-data: http://airtel-aaa-airtel-aaa-ums-service.airtel-aaa.svc.cluster.local:8085/ums/user/status/meta-data
    base-resource-url: http://airtel-aaa-airtel-aaa-ums-service.airtel-aaa.svc.cluster.local:8085/ums/user
    validate-email: http://airtel-aaa-airtel-aaa-ums-service.airtel-aaa.svc.cluster.local:8085/ums/user/validate
    get-filtered-user-url: http://airtel-aaa-airtel-aaa-ums-service.airtel-aaa.svc.cluster.local:8085/ums/user/user-list
  get-basic-info-for-token:
    url: http://airtel-aaa-airtel-aaa-ums-service.airtel-aaa.svc.cluster.local:8085/ums/auth-user/basic-info/{userName}
  get-user-details-for-username:
    url: http://airtel-aaa-airtel-aaa-ums-service.airtel-aaa.svc.cluster.local:8085/ums/auth-user/external/user/{userName}
  permission:
    base-resource-url: http://airtel-aaa-airtel-aaa-ums-service.airtel-aaa.svc.cluster.local:8085/ums/permission
  role:
    base-resource-url: http://airtel-aaa-airtel-aaa-ums-service.airtel-aaa.svc.cluster.local:8085/ums/role
    meta-data-url: http://airtel-aaa-airtel-aaa-ums-service.airtel-aaa.svc.cluster.local:8085/ums/role/meta-data
    filtered-url: http://airtel-aaa-airtel-aaa-ums-service.airtel-aaa.svc.cluster.local:8085/ums/role/role-list
