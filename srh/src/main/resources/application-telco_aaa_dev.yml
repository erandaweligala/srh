#############Access Management Config###################################################################
assisted-channel.secret-key: "${SECRET_KEY}"
access.token-expire-time-millsec: 1800000
#refresh should done before #s before token exp time
jwt.refresh.time.range.sec: 300
#Time where access token remains in redis
jwt.idle.time.range.sec: 1200
#TTL of temp token
temp.token.ttl.sec: 600
prefix.ac: ADMIN_LOGGEDUSER_inventory_DEV_
prefix.temp: ADMIN_TEMPTOKEN_inventory_DEV_

base-url:
  context: /

